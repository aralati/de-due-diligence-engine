[project]
name = "de-due-diligence-engine"
version = "0.1.0"
description = "Multi-Agent Due Diligence Engine für DAX/MDAX Unternehmen"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "httpx>=0.27",
    "polars>=1.5",
    "numpy>=1.26",
    "scipy>=1.13",
    "qdrant-client>=1.10",
    "fastapi>=0.112",
    "uvicorn[standard]>=0.30",
    "celery>=5.4",
    "redis>=5.0",
    "yfinance>=0.2.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
